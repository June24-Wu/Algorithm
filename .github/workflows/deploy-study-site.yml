name: Deploy Algorithm Atlas

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "study_site/**"
      - "AIInfraGuide_Interview/**"
      - "1point3acres/**"
      - "LeetGPU_Triton_Kernal/**"
      - ".github/workflows/deploy-study-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algorithm-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: study_site/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r study_site/requirements.txt
      - name: Test content and API
        run: python -m unittest discover -s study_site/backend -p 'test_*.py' -v
      - name: Build the static site
        run: python study_site/backend/build.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: study_site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
