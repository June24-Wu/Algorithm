<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal study library for AI infrastructure, neural networks, and GPU programming.">
    <meta name="color-scheme" content="light dark">
    <title>Algorithm Atlas · A study library</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script>
      try {
        const saved = localStorage.getItem('atlas-theme');
        document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const fontSize = localStorage.getItem('atlas-font-size');
        if (['16', '18', '20', '22'].includes(fontSize)) document.documentElement.dataset.fontSize = fontSize;
      } catch (_) {}
    </script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="brand" aria-label="Algorithm Atlas home">
          <span class="brand-mark" aria-hidden="true">a<span>·</span></span>
          <span>Algorithm <b>Atlas</b><small>A PERSONAL STUDY LIBRARY</small></span>
        </a>
        <nav class="top-nav" aria-label="Primary navigation">
          <a href="#" id="library-link" class="nav-current">Library <span id="collection-count">03</span></a>
          <a href="https://github.com/June24-Wu/Algorithm" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
        <div class="header-controls">
          <div class="language-switch" id="language-switch" role="group" aria-label="Content language" hidden>
            <button type="button" data-language="zh">中文版</button>
            <button type="button" data-language="en">English</button>
          </div>
          <label class="font-size-control" title="Reading font size">
            <span aria-hidden="true">Aa</span>
            <select id="font-size" aria-label="Reading font size">
              <option value="16">16px</option>
              <option value="18" selected>18px</option>
              <option value="20">20px</option>
              <option value="22">22px</option>
            </select>
          </label>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.3 15.7A8.5 8.5 0 0 1 8.3 3.7a8.5 8.5 0 1 0 12 12Z"/></svg>
          </button>
        </div>
      </div>
      <div class="reading-progress" id="reading-progress"></div>
    </header>
    <div id="app"><main id="main" class="loading-page"><span class="status-dot"></span> Opening the library…</main></div>
    <footer class="site-footer"><span>Algorithm Atlas <span class="footer-dot">·</span> Read. Reason. Repeat.</span><a href="https://github.com/June24-Wu/Algorithm" target="_blank" rel="noopener noreferrer">Made from the repository <span aria-hidden="true">↗</span></a></footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>This study library requires JavaScript. Markdown and Python files are also available in the GitHub repository.</noscript>
  </body>
</html>
